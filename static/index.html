<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask the model</title>
<style>
  :root { --bg:#f7f7f5; --ink:#1d2330; --muted:#6b7280; --line:#d9dbe0; --accent:#2457d6; --card:#ffffff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14171f; --ink:#e8eaf0; --muted:#9aa1b0; --line:#2b303c; --accent:#7ba3ff; --card:#1b1f29; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family: system-ui, -apple-system, "Segoe UI", sans-serif; line-height:1.55; }
  main { max-width:44rem; margin:0 auto; padding:2rem 1rem 3rem; }
  h1 { font-size:1.4rem; margin:0 0 .25rem; }
  p.sub { margin:0 0 1.25rem; color:var(--muted); }
  textarea { width:100%; min-height:7rem; padding:.8rem; font:inherit; color:inherit;
             background:var(--card); border:1px solid var(--line); border-radius:8px; resize:vertical; }
  textarea:focus-visible, button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .row { display:flex; align-items:center; gap:.75rem; margin-top:.75rem; }
  button { font:inherit; padding:.55rem 1.1rem; border:0; border-radius:8px;
           background:var(--accent); color:#fff; cursor:pointer; }
  button:disabled { opacity:.55; cursor:default; }
  .hint { color:var(--muted); font-size:.9rem; }
  #answer { margin-top:1.5rem; padding:1rem; background:var(--card); border:1px solid var(--line);
            border-radius:8px; white-space:pre-wrap; display:none; }
  #answer.error { border-color:#c0392b; color:#c0392b; }
</style>
</head>
<body>
<main>
  <h1>Ask the model</h1>
  <p class="sub">Your question goes to the server, the server asks Groq, and the answer comes back here.</p>

  <textarea id="q" placeholder="Type your question…" autofocus></textarea>
  <div class="row">
    <button id="send">Ask</button>
    <span class="hint">Ctrl + Enter also sends</span>
  </div>

  <div id="answer" role="status"></div>
</main>

<script>
  const q = document.getElementById("q");
  const send = document.getElementById("send");
  const answer = document.getElementById("answer");

  async function ask() {
    const question = q.value.trim();
    if (!question) return;

    send.disabled = true;
    answer.style.display = "block";
    answer.className = "";
    answer.textContent = "Thinking…";

    try {
      // Relative URL: works on localhost, EC2, or behind CloudFront
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || "Request failed");
      answer.textContent = data.answer;   // textContent keeps it safe from injected HTML
    } catch (err) {
      answer.className = "error";
      answer.textContent = "Something went wrong: " + err.message;
    } finally {
      send.disabled = false;
    }
  }

  send.addEventListener("click", ask);
  q.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) ask();
  });
</script>
</body>
</html>
